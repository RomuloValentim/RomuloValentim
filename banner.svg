<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Romulo Valentim, Engenheiro de Requisitos</title>
  <desc id="d">Fluxo que vai da operação real às regras de negócio, à automação e aos SaaS ControlFrota e ZapJato.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1020"/>
      <stop offset="1" stop-color="#112038"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#8FA6C8" opacity="0.14"/>
    </pattern>
    <path id="p1" d="M560,160 H970 C992,160 990,107 1010,107"/>
    <path id="p2" d="M560,160 H970 C992,160 990,213 1010,213"/>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#dots)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="17.5" fill="none" stroke="#243553" stroke-width="1.5"/>

  <!-- Texto -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="60" y="130" font-size="50" font-weight="700" fill="#F2F6FC" letter-spacing="-0.5">Romulo Valentim</text>
    <text x="62" y="172" font-size="22" font-weight="600" fill="#00D4AA">Engenheiro de Requisitos</text>
    <text x="62" y="204" font-size="17" fill="#A9B8D0">Automação, integrações via API e SaaS com IA</text>
  </g>
  <g font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace">
    <text x="62" y="262" font-size="14" fill="#6F83A5">Engenheiro de Requisitos | Analista e Desenvolvedor</text>
  </g>

  <!-- Conectores -->
  <g fill="none" stroke="#2C4268" stroke-width="2" stroke-linecap="round">
    <path d="M670,160 H710"/>
    <path d="M820,160 H860"/>
    <path d="M970,160 C992,160 990,107 1010,107"/>
    <path d="M970,160 C992,160 990,213 1010,213"/>
  </g>

  <!-- Nós -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle">
    <rect x="560" y="137" width="110" height="46" rx="10" fill="#14233F" stroke="#35507F" stroke-width="1.5"/>
    <text x="615" y="160" dominant-baseline="central" fill="#DCE6F5">Operação real</text>

    <rect x="710" y="137" width="110" height="46" rx="10" fill="#14233F" stroke="#35507F" stroke-width="1.5"/>
    <text x="765" y="160" dominant-baseline="central" fill="#DCE6F5">Regras</text>

    <rect x="860" y="137" width="110" height="46" rx="10" fill="#14233F" stroke="#00D4AA" stroke-width="1.5"/>
    <text x="915" y="160" dominant-baseline="central" fill="#DCE6F5">Automação</text>

    <rect x="1010" y="84" width="110" height="46" rx="10" fill="#0E2B33" stroke="#00D4AA" stroke-width="1.8"/>
    <circle cx="1028" cy="107" r="4" fill="#00D4AA"/>
    <text x="1074" y="107" dominant-baseline="central" fill="#E8FFF9">ControlFrota</text>

    <rect x="1010" y="190" width="110" height="46" rx="10" fill="#0F2E22" stroke="#25D366" stroke-width="1.8"/>
    <circle cx="1028" cy="213" r="4" fill="#25D366"/>
    <text x="1070" y="213" dominant-baseline="central" fill="#E9FFF1">ZapJato</text>
  </g>

  <!-- Pacotes de dados percorrendo o fluxo -->
  <circle r="5" fill="#FFB020">
    <animateMotion dur="5s" repeatCount="indefinite" calcMode="linear"><mpath href="#p1"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.94;1" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" fill="#FFB020">
    <animateMotion dur="5s" begin="2.5s" repeatCount="indefinite" calcMode="linear"><mpath href="#p2"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.94;1" dur="5s" begin="2.5s" repeatCount="indefinite"/>
  </circle>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
